[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coopgate"
version = "0.1.0"
description = "Reproducible SUMO multi-agent driving and controller-switching research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "osqp>=1.0", "torch>=2.2", "traci>=1.24", "sumolib>=1.24", "eclipse-sumo>=1.24", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["numba>=0.61,<0.66"]

[project.scripts]
coopgate = "coopgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
