name: test
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libfox-1.6-0
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,fast]'
      - run: pytest -q
      - run: python tools/verify_release_v2.py
      - run: python tools/verify_release_v3.py --replay
      - run: python tools/verify_release_v4.py --replay
      - run: python tools/verify_release_v5.py --replay
      - run: python tools/verify_release_v6.py --replay
      - run: python tools/verify_release_v7.py --replay
      - run: python tools/verify_release_v8.py --replay
      - run: python tools/verify_release_v9.py --replay
