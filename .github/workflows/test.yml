name: test
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libfox-1.6-0
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,fast]'
      - run: pytest -q
      - run: python tools/verify_release_v2.py
      - run: python tools/verify_release_v3.py --replay
      - run: python tools/verify_release_v4.py --replay
      - run: python tools/verify_release_v5.py --replay
      - run: python tools/verify_release_v6.py --replay
      - run: python tools/verify_release_v7.py --replay
      - run: python tools/verify_release_v8.py --replay
      - run: python tools/verify_release_v9.py --replay
      - run: python tools/verify_release_v10.py --replay
      - run: python tools/verify_release_v11.py --replay
      - run: python tools/verify_single_v12.py --replay
      - run: python tools/verify_ego_v13.py --replay --require-acceptance
      - run: python tools/verify_development_v14.py --replay
      - run: python tools/verify_single_v14.py --replay --require-acceptance
      - run: python tools/verify_cooperative_v15.py artifacts/v15/development_stage1/study --replay
      - run: python tools/verify_cooperative_v16.py artifacts/v16/development_stage1/study --replay
      - run: python tools/verify_cooperative_v16.py artifacts/v16/development_stage2/study --replay
      - run: python tools/verify_cooperative_v16.py artifacts/v17/development_stage1/study --replay
      - run: python tools/verify_cooperative_v16.py artifacts/v17/development_stage2/study --replay
      - run: python tools/verify_composed_gate_v18.py artifacts/v18/composition_development/study --replay
      - run: python tools/verify_advantage_gate_v18.py artifacts/v18/advantage_development/study --replay
